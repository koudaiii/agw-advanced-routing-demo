# Publishes only the build guide to GitHub Pages. The simulator is left out on purpose (see .github/pages/build.sh).
# Needs Settings → Pages → Source: "GitHub Actions".
name: Publish guide

on:
  push:
    branches: [main]
    paths:
      - docs/agw-advanced-routing-demo-guide.html
      - docs/agw-advanced-routing-demo-guide_ja.html
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/pages/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
