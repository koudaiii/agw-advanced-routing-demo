# Runs the backend tests and the simulator's browser tests (headless Chrome, already on ubuntu-latest).
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The newest release line (not "latest", which can pick a prerelease); check-latest takes its newest patch.
          node-version: 26
          check-latest: true
      - run: node --test backend/server.test.js tests/simulator.test.mjs
