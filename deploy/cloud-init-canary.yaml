packages: [nodejs]
write_files:
  - path: /etc/apt/preferences.d/nodejs
    content: |
      Package: nodejs
      Pin: release o=Ubuntu
      Pin-Priority: -1
  - path: /opt/agw-demo/server.js
    encoding: b64
    content: 
  - path: /etc/systemd/system/agw-pool@.service
    content: |
      [Unit]
      Description=AGW demo backend %i
      After=network-online.target
      [Service]
      EnvironmentFile=/etc/agw-demo/%i.env
      ExecStart=/usr/bin/node /opt/agw-demo/server.js
      Restart=always
      DynamicUser=yes
      [Install]
      WantedBy=multi-user.target
  - path: /etc/agw-demo/pool-canary.env
    content: |
      POOL_NAME=pool-canary
      PORT=8080
      POOL_LABEL="Canary (new version)"
      POOL_COLOR="#a16207"
      DELAY_MS=0
  - path: /etc/agw-demo/pool-fast.env
    content: |
      POOL_NAME=pool-fast
      PORT=8086
      POOL_LABEL="Fast server"
      POOL_COLOR="#15803d"
      DELAY_MS=0
  - path: /etc/agw-demo/pool-rr-b.env
    content: |
      POOL_NAME=pool-rr-b
      PORT=8087
      POOL_LABEL="Round Robin B"
      POOL_COLOR="#6d28d9"
      DELAY_MS=0
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now agw-pool@pool-canary
  - systemctl enable --now agw-pool@pool-fast
  - systemctl enable --now agw-pool@pool-rr-b
