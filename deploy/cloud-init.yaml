#cloud-config
package_update: true
packages: [nodejs]
write_files:
  - path: /opt/agw-demo/server.js
    encoding: b64
    content: 
  - path: /etc/systemd/system/agw-pool@.service
    content: |
      [Unit]
      Description=AGW demo backend %i
      After=network-online.target
      [Service]
      EnvironmentFile=/etc/agw-demo/%i.env
      ExecStart=/usr/bin/node /opt/agw-demo/server.js
      Restart=always
      DynamicUser=yes
      [Install]
      WantedBy=multi-user.target
  - path: /etc/agw-demo/pool-web.env
    content: |
      POOL_NAME=pool-web
      PORT=8080
      POOL_LABEL="Web (既定)"
      POOL_COLOR="#334155"
  - path: /etc/agw-demo/pool-partner.env
    content: |
      POOL_NAME=pool-partner
      PORT=8081
      POOL_LABEL="パートナー専用"
      POOL_COLOR="#7c2d12"
  - path: /etc/agw-demo/pool-tenant.env
    content: |
      POOL_NAME=pool-tenant
      PORT=8082
      POOL_LABEL="テナント専用"
      POOL_COLOR="#0f766e"
  - path: /etc/agw-demo/pool-api-v2.env
    content: |
      POOL_NAME=pool-api-v2
      PORT=8083
      POOL_LABEL="Orders API v2"
      POOL_COLOR="#1d4ed8"
  - path: /etc/agw-demo/pool-canary.env
    content: |
      POOL_NAME=pool-canary
      PORT=8084
      POOL_LABEL="カナリア"
      POOL_COLOR="#a16207"
  - path: /etc/agw-demo/pool-mobile.env
    content: |
      POOL_NAME=pool-mobile
      PORT=8085
      POOL_LABEL="モバイル"
      POOL_COLOR="#7e22ce"
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now agw-pool@pool-web
  - systemctl enable --now agw-pool@pool-partner
  - systemctl enable --now agw-pool@pool-tenant
  - systemctl enable --now agw-pool@pool-api-v2
  - systemctl enable --now agw-pool@pool-canary
  - systemctl enable --now agw-pool@pool-mobile
