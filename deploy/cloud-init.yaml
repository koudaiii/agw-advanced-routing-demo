packages: [nodejs]
write_files:
  - path: /etc/apt/preferences.d/nodejs
    content: |
      Package: nodejs
      Pin: release o=Ubuntu
      Pin-Priority: -1
  - path: /opt/agw-demo/server.js
    encoding: b64
    content: 
  - path: /etc/systemd/system/agw-srv@.service
    content: |
      [Unit]
      Description=AGW demo backend %i
      After=network-online.target
      [Service]
      EnvironmentFile=/etc/agw-demo/%i.env
      ExecStart=/usr/bin/node /opt/agw-demo/server.js
      Restart=always
      DynamicUser=yes
      [Install]
      WantedBy=multi-user.target
  - path: /etc/agw-demo/srv-web.env
    content: |
      SERVER_NAME=srv-web
      PORT=8080
      SERVER_LABEL="Web (default)"
      SERVER_COLOR="#334155"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-partner.env
    content: |
      SERVER_NAME=srv-partner
      PORT=8081
      SERVER_LABEL="Partner"
      SERVER_COLOR="#7c2d12"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-tenant.env
    content: |
      SERVER_NAME=srv-tenant
      PORT=8082
      SERVER_LABEL="Tenant"
      SERVER_COLOR="#0f766e"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-api-v2.env
    content: |
      SERVER_NAME=srv-api-v2
      PORT=8083
      SERVER_LABEL="Orders API v2"
      SERVER_COLOR="#1d4ed8"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-mobile.env
    content: |
      SERVER_NAME=srv-mobile
      PORT=8085
      SERVER_LABEL="Mobile"
      SERVER_COLOR="#7e22ce"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-slow.env
    content: |
      SERVER_NAME=srv-slow
      PORT=8086
      SERVER_LABEL="Slow server (3 s)"
      SERVER_COLOR="#b91c1c"
      DELAY_MS=3000
  - path: /etc/agw-demo/srv-rr-a.env
    content: |
      SERVER_NAME=srv-rr-a
      PORT=8087
      SERVER_LABEL="Round Robin A"
      SERVER_COLOR="#0e7490"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-standby.env
    content: |
      SERVER_NAME=srv-standby
      PORT=8088
      SERVER_LABEL="Standby (priority 2)"
      SERVER_COLOR="#475569"
      DELAY_MS=0
  - path: /etc/agw-demo/srv-flag-off.env
    content: |
      SERVER_NAME=srv-flag-off
      PORT=8089
      SERVER_LABEL="Feature flag off"
      SERVER_COLOR="#0369a1"
      DELAY_MS=0
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now agw-srv@srv-web
  - systemctl enable --now agw-srv@srv-partner
  - systemctl enable --now agw-srv@srv-tenant
  - systemctl enable --now agw-srv@srv-api-v2
  - systemctl enable --now agw-srv@srv-mobile
  - systemctl enable --now agw-srv@srv-slow
  - systemctl enable --now agw-srv@srv-rr-a
  - systemctl enable --now agw-srv@srv-standby
  - systemctl enable --now agw-srv@srv-flag-off
